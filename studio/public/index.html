<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WePPT · 从想法到演示</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/editor.css"><link rel="stylesheet" href="/generation-progress.css"></head>
<body><header class="app-header"><button class="brand" id="home" aria-label="回到首页">WePPT</button><span class="header-divider"></span><input id="project-title" aria-label="项目名称" value="新的演示稿" maxlength="120"><button id="save-status" class="save-status" title="保存状态">已保存</button><div class="header-actions"><button id="projects">我的项目</button><button id="new-project">新建 PPT</button><span id="model-status" class="model-status">正在连接 AI…</span><button id="open-demo">打开示例</button><button id="export" class="primary" hidden>导出 PPTX</button><button id="logout">退出登录</button></div></header>
<main id="app"></main><div id="toast" role="status" hidden></div><dialog id="modal"><div id="modal-content"></div></dialog><input type="file" id="material-input" multiple accept=".txt,.md,.docx,.pptx,.pdf,image/*" hidden><script type="module" src="/account-bootstrap.js"></script></body></html>
