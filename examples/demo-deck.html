<script>const pages=[...document.querySelectorAll('.page')];let current=0;function show(n){current=Math.max(0,Math.min(pages.length-1,n));pages.forEach((p,i)=>p.classList.toggle('active',i===current));document.getElementById('counter').textContent=(current+1)+' / '+pages.length;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===pages.length-1;}document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.getElementById('print').onclick=()=>print();addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1);}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1);}if(e.key==='Home')show(0);if(e.key==='End')show(pages.length-1);});addEventListener('message',e=>{if(!pages.some(p=>p.querySelector('iframe').contentWindow===e.source)||e.data?.type!=='ppt-navigate')return;const step=e.data.step;if(step===1||step===-1)show(current+step);else if(step==='first')show(0);else if(step==='last')show(pages.length-1);});show(0);</script></body></html>
